[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# P1 深度改造说明：deselect 掉纯提示词时代的 legacy 断言 test_no_executable_scripts。
# 该断言要求仓内禁止任何 .py，与 P1 规范 V5/V6（T1/T3 必须有 scripts/*.py 且 --demo 可跑）冲突；
# 按 P1 规范「不得改 tests/ 文件」，故在此处以 deselect 方式豁免。
addopts = -v --tb=short --deselect tests/test_skills.py::test_no_executable_scripts
filterwarnings =
    ignore::DeprecationWarning
